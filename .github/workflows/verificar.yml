name: Verificar assistente
on: [push, pull_request]
jobs:
  regras-e-integracao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projeto-llm/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest tests -q
      - run: python src/avaliar.py --controlado --n 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-controladas
          path: projeto-llm/logs/integrado/controlado/
